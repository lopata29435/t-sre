spring.application.name=taskboard
spring.main.banner-mode=off
server.address=0.0.0.0
server.port=${PORT:8080}
server.http2.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=${HTTP_THREADS:30}
server.tomcat.threads.min-spare=2
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.jdbc.template.query-timeout=5
spring.flyway.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.time-zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never
app.instance-id=${INSTANCE_ID:${HOSTNAME:local}}
logging.level.root=${LOG_LEVEL:INFO}
