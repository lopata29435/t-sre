<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#185b4f">
    <title>Задачи — Taskboard</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
<header class="topbar">
    <a class="brand" href="/" aria-label="Taskboard — главная"><span class="brand-mark">✓</span> Taskboard</a>
    <span class="topbar-note">Меньше планов в голове</span>
</header>
<main>
    <section class="intro">
        <div><p class="eyebrow">ПЛАН НА ДЕНЬ И ДАЛЬШЕ</p><h1>Всё по порядку.</h1>
            <p class="subtitle">Записывайте задачи и отмечайте, как продвигается работа.</p></div>
        <button id="refresh" class="button secondary" type="button">Обновить список</button>
    </section>
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    <div class="workspace">
        <aside class="editor">
            <div class="section-heading"><span class="eyebrow">ДОБАВИТЬ В ПЛАН</span><span class="small-mark">＋</span></div>
            <h2 id="form-heading">Новая задача</h2>
            <form id="task-form">
                <label for="title">Название <span class="required">*</span></label>
                <input id="title" name="title" required maxlength="160" placeholder="Что нужно сделать?" autocomplete="off">
                <label for="description">Описание <span class="optional">необязательно</span></label>
                <textarea id="description" name="description" maxlength="4000" rows="5" placeholder="Детали, которые пригодятся позже"></textarea>
                <label for="status">Статус</label>
                <select id="status" name="status">
                    <option value="TODO">Нужно сделать</option>
                    <option value="IN_PROGRESS">В работе</option>
                    <option value="DONE">Готово</option>
                </select>
                <button id="submit" class="button primary" type="submit">Добавить задачу</button>
                <button id="cancel" class="button secondary" type="button" hidden>Отменить редактирование</button>
            </form>
        </aside>
        <section class="board" aria-labelledby="board-heading">
            <div class="board-heading"><h2 id="board-heading">Мои задачи <span id="total" class="count">0</span></h2>
                <span id="progress" class="progress">Загрузка…</span></div>
            <div class="filters" role="group" aria-label="Фильтр по статусу">
                <button type="button" data-filter="ALL" aria-pressed="true">Все</button>
                <button type="button" data-filter="TODO" aria-pressed="false">Нужно сделать</button>
                <button type="button" data-filter="IN_PROGRESS" aria-pressed="false">В работе</button>
                <button type="button" data-filter="DONE" aria-pressed="false">Готово</button>
            </div>
            <p id="empty" class="empty" hidden></p>
            <div id="tasks" class="task-list" aria-live="polite" aria-busy="true"></div>
        </section>
    </div>
    <footer>Один небольшой шаг — уже движение вперёд.</footer>
</main>
<template id="task-template">
    <article class="task-card">
        <div class="task-top"><span class="status-badge"></span><span class="task-id"></span></div>
        <h3 class="task-title"></h3>
        <p class="task-description"></p>
        <div class="task-bottom"><time></time><div class="task-actions">
            <button type="button" class="edit">Изменить</button>
            <button type="button" class="delete">Удалить</button>
        </div></div>
    </article>
</template>
</body>
</html>
